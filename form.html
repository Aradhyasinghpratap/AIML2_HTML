<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forms</title>
</head>
<body>
    <fieldset>
        <legend>biodata</legend>
        <form action="./response.html">
            <label for="NAME">USERNAME:</label>
            <input type="text" name="name" id="name" placeholder="ENTER YOUR NAME">
            <br><br>
            <label for="pass">PASSWORD</label>
            <input type="password" name="pass" id="password" placeholder="ENTER YOUR PASSWORD">
            <br><br>
            <label for="dob">DOB:</label>
            <input type="date" name="dob" id="dob" placeholder="date of birth">
            <br><br>
            <label for="gender">GENDER:</label>
            <input type="radio" name="gender" id="gender">
            <label for="male">MALE</label>
            <input type="radio" name="gender" id="gender">
            <label for="femal">FEMALE</label>
            <br><br>
            <label for="hobb">HOBBIES:</label>
            <input type="checkbox" name="hobb1" id="hobb">
            <label for="hobb">cricket</label>
            <input type="checkbox" name="hobb2" id="hobb">
            <label for="hob">football</label>
            <br><br>
            <label for="lang">SELECT LANGUAGE</label>
            <select name="lang" id="lang">
                <option value="."></option>
                <option value="c">c</option>
                <option value="c++">c++</option>
                <option value="java">java</option>
                <option value="python">python</option>
            </select>
            <br><br>
            <label for="add">ADDRESS:</label>
            <textarea name="add" id="add" ></textarea>
            <br><br>
            <label for="tel">PHONE</label>:</label>
            <input type="tel" name="tel" id="tel">
            <br><br>
            <label for="email">EMAIL:</label>
            <input type="email" name="email" id="email">
            <br><br>
            <label for="attempt">ATTEMPT:</label>
            <input type="number" name="attempt" id="attempt">
            <br><br>
            <label for="url">HOMEPAGE:</label>
            <input type="url" name="url" id="url">
            <br><br>
            <label for="file">RESUME</label>
            <input type="file" name="file" id="file">
            <br><br>
            <input type="submit">&nbsp;
            <input type="reset">
        </form>
    </fieldset>
    
</body>
</html>
